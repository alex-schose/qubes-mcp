# qubes-mcp runtime directories, recreated at every boot, and the files root
# and the services share.
#
# Installed to /etc/tmpfiles.d/qmcp.conf and applied with
#   systemd-tmpfiles --create /etc/tmpfiles.d/qmcp.conf
#
# The qmcp.* services run under qrexec as a non-root dom0 user in the `qubes`
# group, so the directories are root:qubes and group-writable (setgid keeps new
# files in the group) — but /run/qmcp itself, which is 2750 (a `d` line sets
# the mode of a directory that exists too, so one an older release made 2770
# is corrected): renaming or replacing an entry takes write
# permission on its parent, so nobody but root can swap a subdirectory for a
# link that would send root's opens elsewhere. What the services create,
# re-make or remove goes in state/ instead: the locks both sides take (create,
# proposals, gate) and the gate's heartbeat, the audit-dropped counter, the
# restore check's failure records and the in-qube writer locks. They hold lock files, and the gate's heartbeat: calls/
# for the per-caller concurrency slots, qubes/ for the per-qube locks (a service
# that operates a qube and an operator command that changes its role take the
# same file, whoever made it first) and their turnstiles (`<name>.queue`, which
# every taker passes through and an operator's command waits in, so calls that
# arrive after it cannot keep taking the lock first), create.lock for the create
# lock and create.queue for its turnstile,
# proposals.lock for the proposal store, and gate.lock and gate.last for the
# anonymity gate. Without
# them every qmcp.* call refuses, by design.
#
# create.lock and create.queue are declared too, root:qubes 0660, and `z`
# corrects an existing one. The operator's `qmcp project` commands take it as root; when root created
# it first, under sudo, it came out root:qubes 0600, the non-root services could
# no longer open it, and every create refused. Measured on Qubes 4.3.1 on
# 2026-10-01. The same holds for every file below that both write:
#
# - the proposal store: the services write the hub's proposals into it, and the
#   operator's `qmcp proposal accept` and `reject`, as root, write decisions the
#   services read back, so it is setgid qubes; its lock is shared the same way;
# - the record of what AI space removed (/var/lib/qmcp/removed): the services
#   write one file per qube the hub or a lead removes, and the restore check
#   (the gate's user) reads them, so it is setgid qubes too;
# - the anonymity gate's lock and heartbeat: the timer's runs (as the
#   services' user) and every `qmcp` command that changes qubes, projects or
#   gateways (often as root) take the lock, one run at a time; only the timer's runs touch the
#   heartbeat, which `qmcp check` requires to be recent;
# - the open-window records (/run/qmcp/open): root writes one when the
#   operator opens a guarded qube, and the expiry pass, which runs as the
#   services' user, unlinks it. In /run on purpose: a boot leaves every
#   record gone, which is why qmcp-seal.service strips the badges at boot
#   rather than trusting a record it would not find;
# - the audit log: the services append to it, and so does every command of the
#   operator's that changes something. Created by a root process that did not
#   hand it to `qubes` (qmcp's own writer does), it would be root's group, and
#   the services' lines would stop without a symptom.
# - the RAM audit chains (/run/qmcp/audit): a project whose lines go to RAM
#   (`qmcp project audit`), the install's in mode ram, and a line whose
#   project cannot be worked out. Root and the services both append there,
#   so it is setgid qubes like the rest; a boot leaves it empty, as meant.
#
# Type Path                       Mode UID  GID   Age Argument
d      /run/qmcp                  2750 root qubes -
d      /run/qmcp/state            2770 root qubes -
d      /run/qmcp/calls            2770 root qubes -
d      /run/qmcp/qubes            2770 root qubes -
d      /run/qmcp/open             2770 root qubes -
d      /run/qmcp/audit            2770 root qubes -
f      /run/qmcp/state/create.lock      0660 root qubes -
z      /run/qmcp/state/create.lock      0660 root qubes -
f      /run/qmcp/state/create.queue     0660 root qubes -
z      /run/qmcp/state/create.queue     0660 root qubes -
f      /run/qmcp/state/proposals.lock   0660 root qubes -
z      /run/qmcp/state/proposals.lock   0660 root qubes -
f      /run/qmcp/state/gate.lock        0660 root qubes -
z      /run/qmcp/state/gate.lock        0660 root qubes -
f      /run/qmcp/state/gate.last        0660 root qubes -
z      /run/qmcp/state/gate.last        0660 root qubes -
d      /var/lib/qmcp              0755 root root  -
d      /var/lib/qmcp/proposals    2770 root qubes -
d      /var/lib/qmcp/removed      2770 root qubes -
f      /var/log/qmcp-audit.log    0660 root qubes -
z      /var/log/qmcp-audit.log    0660 root qubes -
f      /var/log/qmcp-audit.log.pad 0660 root qubes -
