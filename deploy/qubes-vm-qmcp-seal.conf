# Installed as
#   /etc/systemd/system/qubes-vm@.service.d/10-qmcp-seal.conf
# a drop-in on Qubes' own per-qube autostart unit. A drop-in on the TEMPLATE
# applies to every instance, which is what is wanted: no autostart qube starts
# before qmcp-seal.service has taken the open badges off.
#
# Ordering only. qmcp-seal.service is pulled into the boot by its own
# WantedBy=multi-user.target, and a failure of it must not stop a qube
# starting, so there is no Requires here.
#
# deploy/uninstall.sh removes this file and the directory if it leaves it
# empty. It is the one file qmcp installs that belongs to a Qubes unit, and it
# changes that unit's ordering only.

[Unit]
After=qmcp-seal.service
