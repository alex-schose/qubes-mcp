# qmcp tmpfiles — Stage I-6 consent runtime dir.
#
# Installed to /etc/tmpfiles.d/qmcp.conf; applied with
#   systemd-tmpfiles --create /etc/tmpfiles.d/qmcp.conf
#
# Creates the runtime dir the consent daemon binds its AF_UNIX socket inside.
# Mode 2770 root:qubes: setgid so entries stay in the `qubes` group; group rwx
# lets the wrapper user (uid 1000, group `qubes`) and the operator GUI session
# (also uid 1000, group `qubes`) reach the socket, while a non-`qubes` uid —
# and AI, which has no dom0 file access at all — cannot. The daemon additionally
# chmods the socket itself 0660 after bind.
#
# Type Path        Mode UID  GID   Age Argument
d /run/qmcp 2770 root qubes -
